[pytest]
testpaths = tests
# Les tests d'orchestration font tourner une session complète sur le banc
# simulé : quelques minutes. Ils vérifient ce qu'aucun test unitaire ne peut
# voir — que les couches tiennent ensemble — donc ils restent dans la suite,
# mais on peut les écarter d'un cycle de développement rapide :
#
#   PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest -q -m "not lent"
markers =
    lent: session complète sur le banc simulé (plusieurs minutes)
